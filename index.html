.vuoto {

.carrello {
  position: fixed;
  bottom: 15px;
  left: 15px;
  right: 15px;
  background: #2B1A12;
  color: white;

  border-radius: 15px;

.carrello-testa {

}

.carrello b {

.prodotto-carrello {

.controlli {
  display: flex;

.controlli button {

.carrello-footer {

footer {

@media(max-width:380px) {

    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .card { padding: 10px; }

}
</style>

  {name:"Siag 50 + kit", prezzo:8, marca:"Siag", pezzi:50, categoria:"cialde"},
  {name:"Siag Oro 50 + kit", prezzo:9, marca:"Siag", pezzi:50, categoria:"cialde"},
  {name:"Toraldo Cremoso 50", prezzo:8, marca:"Toraldo", pezzi:50, categoria:"cialde"},
  {name:"Toraldo Cremoso 150", prezzo:21, marca:"Toraldo", pezzi:150, categoria:"cialde"},

  {name:"Borbone Rosso Dolce Gusto", prezzo:13.50, marca:"Borbone", pezzi:50, categoria:"capsule"},
  {name:"Borbone Oro Dolce Gusto", prezzo:23, marca:"Borbone", pezzi:90, categoria:"capsule"},

  {name:"Lollo A Modo Mio", prezzo:20, marca:"Lollo", pezzi:100, categoria:"capsule"},
  {name:"Moreno A Modo Mio", prezzo:18, marca:"Moreno", pezzi:100, categoria:"capsule"},
  {name:"Toraldo Cremosa A Modo Mio", prezzo:20, marca:"Toraldo", pezzi:100, categoria:"capsule"},

  // CAFFÈ E NON SOLO

  {

  categoria:"altro"
},

{
  name: "TrentoDoc",
  prezzo:15,

},

{
  name:"Ferrari",

  categoria:"altro"
},

  {

    marca:"Dolci",

  {

    prezzo:2,
    marca:"Cioccolato",
    pezzi:1,
    dettaglio:"150 grammi",
    categoria:"altro",
    prezzoScontato:1.50,
    soglia:10
  }

];

let filtroAttivo = "tutti";
let carrello = {};

function euro(numero) {
  return numero.toFixed(2).replace(".", ",");
}

// CALCOLO PREZZO UNITARIO CON EVENTUALE SCONTO

function prezzoUnitario(p, quantita) {

  if (p.prezzoScontato && quantita >= p.soglia) {
    return p.prezzoScontato;
  }

  return p.prezzo;
}

// VISUALIZZAZIONE PRODOTTI

function mostra() {

  const testo = document.getElementById("cerca")
    .value.toLowerCase().trim();

  const gridCialde = document.getElementById("gridCialde");
  const gridCapsule = document.getElementById("gridCapsule");
  const gridAltro = document.getElementById("gridAltro");

  const sezioneCialde = document.getElementById("sezioneCialde");
  const sezioneCapsule = document.getElementById("sezioneCapsule");
  const sezioneAltro = document.getElementById("sezioneAltro");

  gridCialde.innerHTML = "";
  gridCapsule.innerHTML = "";
  gridAltro.innerHTML = "";

  const risultati = prodotti.filter(p => {

    const nome = p.name.toLowerCase();
    const marca = p.marca.toLowerCase();

    let okFiltro = true;

    if (
      filtroAttivo === "cialde" ||
      filtroAttivo === "capsule" ||
      filtroAttivo === "altro"
    ) {

      okFiltro = p.categoria === filtroAttivo;

    } else if (filtroAttivo === "150") {

      okFiltro = p.pezzi !== null && p.pezzi >= 150;

    } else if (filtroAttivo === "50") {

      okFiltro = p.pezzi === 50;

    } else if (filtroAttivo !== "tutti") {

      okFiltro =
        nome.includes(filtroAttivo.toLowerCase()) ||
        marca.includes(filtroAttivo.toLowerCase());

    }

    const okTesto =
      nome.includes(testo) ||
      marca.includes(testo) ||
      p.categoria.includes(testo) ||
      (p.dettaglio || "").toLowerCase().includes(testo);

    return okFiltro && okTesto;

  });

  // CREAZIONE SCHEDA PRODOTTO

  function creaScheda(p) {

    const indice = prodotti.indexOf(p);

    const prezzoPezzo = p.pezzi && p.categoria !== "altro"
      ? "€ " + euro(p.prezzo / p.pezzi) + " a pezzo"
      : "";

    const quantita = p.dettaglio
      ? p.dettaglio
      : p.pezzi
        ? p.pezzi + " pezzi"
        : (p.categoria === "cialde"
          ? "Cialde ESE 44mm"
          : "Capsule");

    const prezzoSpeciale = p.prezzoScontato
      ? `<span class="prezzo-speciale">
           Da ${p.soglia} pezzi: € ${euro(p.prezzoScontato)} cad.
         </span>`
      : "";

    return `
      <div class="card">

        <div class="marca">${p.marca}</div>

        <h3>${p.name}</h3>

        <div class="pezzi">
          ${quantita}
        </div>

        <div class="prezzo">
          € ${euro(p.prezzo)}
          ${prezzoPezzo ? `<br><small>${prezzoPezzo}</small>` : ""}
          ${prezzoSpeciale}
        </div>

        <button onclick="aggiungi(${indice})">
          + Aggiungi
        </button>

      </div>
    `;
  }

  // DIVISIONE CATEGORIE

  const cialde = risultati.filter(
    p => p.categoria === "cialde"
  );

  const capsule = risultati.filter(
    p => p.categoria === "capsule"
  );

  const altro = risultati.filter(
    p => p.categoria === "altro"
  );

  // VISUALIZZA CIALDE

  if (cialde.length > 0) {

    sezioneCialde.style.display = "block";
    gridCialde.innerHTML = cialde.map(creaScheda).join("");

  } else {

    sezioneCialde.style.display = "none";

  }

  // VISUALIZZA CAPSULE

  if (capsule.length > 0) {

    sezioneCapsule.style.display = "block";
    gridCapsule.innerHTML = capsule.map(creaScheda).join("");

  } else {

    sezioneCapsule.style.display = "none";

  }

  // VISUALIZZA CAFFÈ E NON SOLO

  if (altro.length > 0) {

    sezioneAltro.style.display = "block";
    gridAltro.innerHTML = altro.map(creaScheda).join("");

  } else {

    sezioneAltro.style.display = "none";

  }

  // NESSUN RISULTATO

  if (risultati.length === 0) {

    sezioneCialde.style.display = "block";

    gridCialde.innerHTML =
      '<div class="vuoto">Nessun prodotto trovato ☕</div>';

  }

}

// FILTRI

document.querySelectorAll("#filtri button").forEach(btn => {

  btn.addEventListener("click", function() {

    filtroAttivo = this.dataset.filtro;

    document.querySelectorAll("#filtri button").forEach(b => {
      b.classList.remove("attivo");
    });

    this.classList.add("attivo");

    mostra();

  });

});

// RICERCA

document.getElementById("cerca")
  .addEventListener("input", mostra);

// AGGIUNGI AL CARRELLO

function aggiungi(indice) {

  if (!carrello[indice]) {
    carrello[indice] = 0;
  }

  carrello[indice]++;

  aggiornaCarrello();

}

// MODIFICA QUANTITÀ

function modificaQuantita(indice, variazione) {

  if (!carrello[indice]) return;

  carrello[indice] += variazione;

  if (carrello[indice] <= 0) {
    delete carrello[indice];
  }

  aggiornaCarrello();

}

// RIMUOVI PRODOTTO

function rimuovi(indice) {

  delete carrello[indice];

  aggiornaCarrello();

}

// SVUOTA CARRELLO

function svuotaCarrello() {

  carrello = {};

  aggiornaCarrello();

}

// AGGIORNA CARRELLO

function aggiornaCarrello() {

  const contenitore = document.getElementById("carrello");
  const lista = document.getElementById("listaCarrello");

  const elementi = Object.entries(carrello);

  const numeroProdotti = elementi.reduce(
    (somma, [indice, quantita]) => somma + quantita, 0
  );

  // CALCOLO TOTALE CON SCONTI

  const totale = elementi.reduce(
    (somma, [indice, quantita]) =>
      somma + prezzoUnitario(prodotti[indice], quantita) * quantita,
    0
  );

  if (numeroProdotti === 0) {

    contenitore.style.display = "none";
    return;

  }

  contenitore.style.display = "flex";

  document.getElementById("conteggio").innerText =
    numeroProdotti +
    (numeroProdotti === 1 ? " prodotto" : " prodotti") +
    " nel carrello";

  document.getElementById("totale").innerText =
    "Totale: € " + euro(totale);

  document.getElementById("totaleFinale").innerText =
    "€ " + euro(totale);

  lista.innerHTML = "";

  // ELENCO PRODOTTI NEL CARRELLO

  elementi.forEach(([indice, quantita]) => {

    const p = prodotti[indice];

    const prezzo = prezzoUnitario(p, quantita);
    const subtotale = prezzo * quantita;

    const scontoApplicato =
      p.prezzoScontato && quantita >= p.soglia;

    lista.innerHTML += `
      <div class="prodotto-carrello">

        <div>
          <strong>${p.name}</strong><br>
          ${quantita} x € ${euro(prezzo)}
          <br>
          Subtotale: € ${euro(subtotale)}
          ${scontoApplicato
            ? '<br><span style="color:#7CFF9B">Sconto applicato!</span>'
            : ''}
        </div>

        <div class="controlli">

          <button onclick="modificaQuantita(${indice},-1)">−</button>

          <strong>${quantita}</strong>

          <button onclick="modificaQuantita(${indice},1)">+</button>

          <button
            onclick="rimuovi(${indice})"
            style="background:#8b3434;color:white">
            ×
          </button>

        </div>

      </div>
    `;

  });

  // MESSAGGIO WHATSAPP

  let messaggio = "Ciao! Voglio effettuare questo ordine:\n\n";

  elementi.forEach(([indice, quantita]) => {

    const p = prodotti[indice];

    const prezzo = prezzoUnitario(p, quantita);
    const subtotale = prezzo * quantita;

    messaggio +=
      "- " + p.name +
      " x " + quantita +
      " (" + euro(prezzo) + " cad.)" +
      " = € " + euro(subtotale) + "\n";

  });

  messaggio += "\nTotale ordine: € " + euro(totale);

  const telefono = "393479180849";

  document.getElementById("ordinaBtn").href =
    "https://wa.me/" + telefono +
    "?text=" + encodeURIComponent(messaggio);
